<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rover — карта</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"
        integrity="sha384-4CB9Vtol9LN6lGgBCvmPLbUEZwilrqIvPieSRurgAXAB7FVJaLS9n8WyAIA5wjQ+" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --field: var(--tg-theme-secondary-bg-color, #f1f2f5);
    --accent: #f5a623;
    --accent-text: #111111;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  #pin { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 500;
    pointer-events: none; font-size: 40px; line-height: 1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  #locate { position: fixed; right: 14px; z-index: 600; width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: var(--bg); color: var(--text); font-size: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }

  /* нижня панель, як в Uklon */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 600; background: var(--bg);
    border-radius: 20px 20px 0 0; padding: 10px 14px 16px; box-shadow: 0 -4px 18px rgba(0,0,0,.18); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(128,128,128,.35); margin: 0 auto 10px; }
  .field { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 12px;
    padding: 12px; margin-bottom: 8px; cursor: pointer; min-height: 46px; }
  .field .ic { width: 22px; text-align: center; font-size: 16px; }
  .field .tx { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .field .tx.ph { color: var(--hint); }
  .field.next { box-shadow: inset 0 0 0 2px var(--accent); }
  .field.next .tx.ph { color: var(--text); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 12px; border-radius: 18px; background: var(--field); font-size: 14px; cursor: pointer; }
  #summary { margin-top: 4px; }
  #price { font-size: 18px; font-weight: 700; }
  #price small { display: block; font-weight: 400; font-size: 13px; color: var(--hint); }
  #what { width: 100%; margin-top: 8px; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--accent);
    background: var(--field); color: var(--text); font: inherit; resize: none; }
  #note { width: 100%; margin-top: 8px; padding: 11px 12px; border-radius: 12px; border: 0; background: var(--field);
    color: var(--text); font-size: 15px; }
  #fallback { display: none; width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 700; }
  #pinbar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 600; background: var(--bg); border-radius: 14px;
    padding: 10px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #pinbar b { display: block; padding-right: 44px; }
  #pinbar span { display: block; padding-right: 44px; }
  #pinSearch { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px;
    border: 0; border-radius: 10px; background: var(--field); font-size: 18px; }
  #pinbar span { color: var(--hint); font-size: 14px; }

  /* екран пошуку */
  #search { position: fixed; inset: 0; z-index: 900; background: var(--bg); display: flex; flex-direction: column; }
  #search header { display: flex; gap: 8px; align-items: center; padding: 12px; }
  #search header button { border: 0; background: none; color: var(--text); font-size: 22px; width: 36px; }
  #q { flex: 1; padding: 12px; border-radius: 12px; border: 0; background: var(--field); color: var(--text); font-size: 16px; }
  #results { overflow-y: auto; flex: 1; padding: 0 6px 20px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 11px 10px; border-radius: 10px; cursor: pointer; }
  .item:active { background: var(--field); }
  .item .ic { width: 30px; height: 30px; border-radius: 50%; background: var(--field); display: flex;
    align-items: center; justify-content: center; flex: none; }
  .item .nm { font-weight: 600; }
  .item .sb { color: var(--hint); font-size: 13px; }
  .group { color: var(--hint); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 12px 12px 4px; }
  .poi { background: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center;
    justify-content: center; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .hidden { display: none !important; }
  .leaflet-control-attribution { font-size: 9px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="pin" class="hidden">📍</div>
<div id="pinbar" class="hidden"><button id="pinSearch" title="Пошук адреси">🔎</button><b id="pinTitle">Вкажіть на карті</b><span id="pinAddr">Рухайте карту — мітка в центрі</span></div>
<button id="locate" title="Я тут">◎</button>

<div id="sheet">
  <div class="grab"></div>
  <div class="field" id="fFrom"><span class="ic">🟢</span><span class="tx ph" id="tFrom">Звідки?</span></div>
  <div class="field" id="fTo"><span class="ic">🏁</span><span class="tx ph" id="tTo">Куди їдемо?</span></div>
  <div class="chips" id="chips"></div>
  <div id="summary" class="hidden">
    <div id="price"></div>
    <textarea id="what" class="hidden" rows="2" maxlength="300" placeholder="📦 Що привезти? Напр.: хліб і молоко, ліки з аптеки, піца з кафе"></textarea>
    <input id="note" placeholder="💬 Коментар водію: під'їзд, будинок, багаж… (не обов'язково)" maxlength="200">
  </div>
  <button id="fallback"></button>
</div>

<div id="search" class="hidden">
  <header><button id="sBack">←</button><input id="q" autocomplete="off" placeholder="Адреса або місце"></header>
  <div id="results"></div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  // Відкрито з кнопки меню бота: initData там ПОРОЖНІЙ (так задумав Telegram), тому перевіряємо платформу.
  const IN_TG = !!(tg && tg.platform && tg.platform !== "unknown");
  const params = new URLSearchParams(location.search);
  let cfg = {};
  try {
    const raw = params.get("c") || "";
    cfg = JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g, "+").replace(/_/g, "/")))));
  } catch (e) { cfg = {}; }

  const CITY = cfg.h || [48.3175, 31.5300];
  // доставка: лише одна мітка «куди привезти» + що привезти; посадки немає
  const DELIVERY = cfg.m === "delivery";
  const CITY_NAME = "Новоукраїнка";
  const centers = {};
  (cfg.c || []).forEach(([name, zone, lat, lon]) => { centers[name] = [lat, lon, zone]; });

  const $ = (id) => document.getElementById(id);
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const map = L.map("map", { zoomControl: false }).setView(CITY, 14);
  let gl = null;   // векторна карта MapLibre під Leaflet — з неї беремо назви закладів під міткою
  // власні стилі Rover (день/ніч) на даних OpenFreeMap; тема — як у Telegram (світла/темна)
  const isDark = () => (IN_TG ? tg.colorScheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);
  const styleUrl = () => new URL(isDark() ? "rover-night.json" : "rover-day.json", location.href).href;
  try {
    gl = L.maplibreGL({ style: styleUrl(),
                              attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> © OpenStreetMap' }).addTo(map);
    if (IN_TG) tg.onEvent("themeChanged", () => gl.getMaplibreMap().setStyle(styleUrl()));
  } catch (e) {
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  }

  // ---------- спільне ----------
  const round = (x) => Math.floor(x + 0.5);
  function km(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function center() { const c = map.getCenter(); return [+c.lat.toFixed(6), +c.lng.toFixed(6)]; }
  let mainHandler = null;
  function setButton(text, onClick) {
    if (IN_TG && tg.MainButton) {
      if (mainHandler) tg.MainButton.offClick(mainHandler);
      mainHandler = onClick;
      tg.MainButton.setText(text);
      tg.MainButton.onClick(onClick);
      tg.MainButton.show();
    } else {
      const fb = $("fallback"); fb.style.display = "block"; fb.textContent = text; fb.onclick = onClick;
    }
  }
  function hideButton() {
    if (IN_TG && tg.MainButton) tg.MainButton.hide(); else $("fallback").style.display = "none";
  }
  let backHandler = null;
  function setBack(fn) {
    backHandler = fn;
    if (IN_TG && tg.BackButton) fn ? tg.BackButton.show() : tg.BackButton.hide();
  }
  if (IN_TG && tg.BackButton) tg.BackButton.onClick(() => backHandler && backHandler());

  // ---------- місця: Нова Пошта (наживо з її API) + список із таблиці ----------
  const CATEGORY = { "🛒": "магазин супермаркет продукти маркет", "👕": "одяг магазин", "👟": "взуття магазин",
    "🧁": "кондитерська торти солодощі", "🥖": "хліб пекарня", "🥩": "м'ясо ковбаси магазин", "🧴": "косметика побутова хімія магазин",
    "☕": "кафе кав'ярня кава", "🍽": "ресторан кафе їжа", "🍔": "фастфуд їжа", "🍕": "піца піцерія суші", "🍣": "суші",
    "🍺": "бар паб пиво", "💊": "аптека ліки", "🏥": "лікарня поліклініка", "🦷": "стоматологія", "🏦": "банк банкомат",
    "⛽": "азс заправка пальне", "🚌": "автостанція автовокзал автобус", "🚉": "вокзал залізниця потяг",
    "🏫": "школа", "🧸": "садочок дитсадок", "🎓": "училище коледж", "🚓": "поліція", "🏛": "адміністрація музей", "🏬": "епіцентр будівельний магазин",
    "⛪": "церква храм", "🎭": "палац культури клуб", "🏨": "готель", "🐾": "ветеринар", "📦": "нова пошта посилки" };
  const places = (cfg.pl || []).map(([name, lat, lon, icon]) => ({ name, sub: "", lat, lon, icon: icon || "📌", own: true }));
  const npPlaces = [];
  const poiLayer = L.layerGroup().addTo(map);      // свої місця й Нова Пошта — видно завжди
  const cityLayer = L.layerGroup();                // решта місць міста — лише при наближенні
  function drawPoi(p, layer) {
    L.marker([p.lat, p.lon], { icon: L.divIcon({ html: `<div class="poi">${p.icon}</div>`, className: "", iconSize: [26, 26] }) })
      .on("click", () => choose(activeSide || (state.to ? "from" : "to"), p))
      .bindTooltip(esc(p.name), { direction: "top", offset: [0, -12] })
      .addTo(layer || poiLayer);
  }
  places.forEach((p) => drawPoi(p));
  const toggleCity = () => (map.getZoom() >= 15 ? cityLayer.addTo(map) : cityLayer.remove());
  map.on("zoomend", toggleCity);
  // місця поруч зі сторінкою: extra_places.json — додані адміном у боті (видно завжди),
  // places.json — база міста (магазини, кафе, аптеки…), видно при наближенні
  function addPlaces(list, own) {
    list.forEach((p) => {
      if (places.some((q) => q.name === p.name && km([q.lat, q.lon], [p.lat, p.lon]) < 0.05)) return;
      p.own = own; places.push(p); drawPoi(p, own ? poiLayer : cityLayer);
    });
  }
  const load = (file) => fetch(`${file}?v=${Date.now() / 60000 | 0}`).then((r) => (r.ok ? r.json() : [])).catch(() => []);
  Promise.all([load("extra_places.json"), load("places.json")]).then(([extra, city]) => {
    addPlaces(extra, true); addPlaces(city, false); toggleCity(); chips();
  });
  fetch("https://api.novaposhta.ua/v2.0/json/", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey: "", modelName: "AddressGeneral", calledMethod: "getWarehouses",
      methodProperties: { CityName: CITY_NAME, Limit: "100", Language: "UA" } }),
  }).then((r) => r.json()).then((j) => {
    (j.data || []).filter((w) => (w.CityDescription || "").startsWith(CITY_NAME) && +w.Latitude).forEach((w) => {
      const [title, ...rest] = w.Description.split(":");
      const kind = title.replace(/\s*\(.*?\)/, "").replace(/["«»]?Нова Пошта["«»]?/gi, "").replace(/\s+/g, " ").trim();
      const p = { name: `Нова Пошта · ${kind}`, sub: rest.join(":").trim(),
                  lat: +w.Latitude, lon: +w.Longitude, icon: "📦", np: true };
      npPlaces.push(p); drawPoi(p);
    });
  }).catch(() => {});

  // ---------- адреса за координатами (з номером будинку, якщо він є в даних карти) ----------
  async function getJSON(url, ms) {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), ms || 4000);
    try { return await (await fetch(url, { signal: ctrl.signal })).json(); } finally { clearTimeout(timer); }
  }
  async function reverseAddr(lat, lon) {
    let street = "", number = "", town = "";
    try {
      const f = (await getJSON(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&limit=1&lang=default`, 3000)).features || [];
      const pr = f[0] ? f[0].properties : {};
      street = pr.street || (pr.type === "street" ? pr.name : "") || ""; number = pr.housenumber || ""; town = pr.city || pr.town || pr.village || "";
    } catch (e) { /* далі Nominatim */ }
    if (!street || !number) {
      try {
        const a = (await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=uk&lat=${lat}&lon=${lon}`)).address || {};
        if (!street) street = a.road || a.pedestrian || "";
        if (!number && (a.road || "") === street) number = a.house_number || "";
        town = town || a.village || a.town || a.city || "";
      } catch (e) { /* лишаємо що є */ }
    }
    const base = [street, number].filter(Boolean).join(", ");
    const name = base ? (town && town !== CITY_NAME ? `${base}, ${town}` : base) : (town && town !== CITY_NAME ? town : "");
    return { name, number: !!number, street };
  }

  // ---------- стан замовлення ----------
  const state = { from: null, to: null };   // {lat, lon, name}
  let routeLine = null, markers = [];

  function setField(side) {
    const p = state[side], el = side === "from" ? $("tFrom") : $("tTo");
    el.textContent = p ? p.name : (side === "from" ? "Звідки?" : "Куди їдемо?");
    el.classList.toggle("ph", !p);
  }
  // маршрут по дорогах (сервіс OSRM від OpenStreetMap): справжні кілометри й час
  let route = null, routeSeq = 0;
  async function fetchRoute(a, b) {
    const seq = ++routeSeq;
    try {
      const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
      const url = `https://routing.openstreetmap.de/routed-car/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}`
        + "?overview=full&geometries=geojson";
      const j = await (await fetch(url, { signal: ctrl.signal })).json();
      clearTimeout(timer);
      if (seq !== routeSeq || j.code !== "Ok") return;
      const r = j.routes[0];
      route = { km: Math.max(0.1, Math.round(r.distance / 100) / 10), min: Math.max(1, Math.round(r.duration / 60)),
                line: r.geometry.coordinates.map(([lon, lat]) => [lat, lon]) };
      redraw(true);
    } catch (e) { /* немає зв'язку з сервісом — лишається оцінка по прямій */ }
  }

  function redraw(keepRoute) {
    markers.forEach((m) => m.remove()); markers = [];
    if (routeLine) { routeLine.remove(); routeLine = null; }
    if (!keepRoute) route = null;
    [["from", "🟢"], ["to", "🏁"]].forEach(([side, icon]) => {
      const p = state[side];
      if (p) markers.push(L.marker([p.lat, p.lon], { icon: L.divIcon({ html: `<div style="font-size:24px">${icon}</div>`, className: "", iconSize: [24, 24] }) }).addTo(map));
    });
    setField("from"); setField("to");
    $("fFrom").classList.toggle("hidden", DELIVERY);
    $("fTo").classList.toggle("next", !DELIVERY && !!state.from && !state.to);
    if (DELIVERY) { redrawDelivery(keepRoute); placeLocate(); return; }
    // коли маршрут готовий — лише ціна, коментар і «Замовити» (швидкі кнопки ховаємо)
    $("chips").classList.toggle("hidden", !!(state.from && state.to));
    if (state.from && state.to) {
      routeLine = route
        ? L.polyline(route.line, { color: "#f5a623", weight: 6, opacity: .95 }).addTo(map)
        : L.polyline([[state.from.lat, state.from.lon], [state.to.lat, state.to.lon]],
                     { color: "#f5a623", weight: 4, dashArray: "8 8", opacity: .7 }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { paddingTopLeft: [40, 40], paddingBottomRight: [40, 330] });
      if (!keepRoute) fetchRoute(state.from, state.to);
      const est = estimate([state.from.lat, state.from.lon], [state.to.lat, state.to.lon]);
      $("price").innerHTML = `≈ ${est.price} грн <small>${esc(est.label)}${cfg.n > 1 ? " · " + esc(cfg.nl || "нічний тариф") : ""} · водії запропонують свої ціни</small>`;
      $("summary").classList.remove("hidden");
      setButton(`✅ Замовити · ≈ ${est.price} грн`, finish);
    } else {
      $("summary").classList.add("hidden");
      hideButton();
      const p = state.from || state.to;
      if (p) map.setView([p.lat, p.lon], 16);
    }
    placeLocate();
  }
  function redrawDelivery(keepRoute) {
    $("chips").classList.add("hidden");
    $("tTo").textContent = state.to ? state.to.name : "Куди привезти?";
    if (!state.to) { $("summary").classList.add("hidden"); hideButton(); return; }
    map.setView([state.to.lat, state.to.lon], 16);
    if (!keepRoute) fetchRoute({ lat: CITY[0], lon: CITY[1] }, state.to);   // км від центру — для ціни
    const dist = route ? route.km : Math.max(1, Math.ceil(km(CITY, [state.to.lat, state.to.lon]) * (cfg.f || 1.3)));
    const night = cfg.n || 1;
    let price;
    if (km([state.to.lat, state.to.lon], CITY) > (cfg.r || 4)) {
      const o = cfg.o || [150, 31.2]; price = round(o[0] + dist * o[1]);
    } else {
      const cm = cfg.cm || [130, 13, 150], dl = cfg.dl || [150, 200];
      price = Math.min(round(dl[1]), Math.max(round(dl[0]), Math.max(round(cm[2]), round(cm[0] + dist * cm[1]))));
    }
    price = round(price * night);
    $("price").innerHTML = `≈ ${price} грн <small>доставка${night > 1 ? " · " + esc(cfg.nl || "нічний тариф") : ""} · водій зателефонує й уточнить деталі</small>`;
    $("what").classList.remove("hidden"); $("note").classList.add("hidden");
    $("summary").classList.remove("hidden");
    setButton(`✅ Замовити доставку · ≈ ${price} грн`, finishDelivery);
  }
  function finishDelivery() {
    const what = $("what").value.trim();
    if (!what) {
      $("what").focus();
      if (IN_TG) tg.showAlert("Напишіть, що потрібно привезти 🙂"); else alert("Напишіть, що потрібно привезти");
      return;
    }
    const data = JSON.stringify({ t: "delivery", to: [state.to.lat, state.to.lon], ta: state.to.name.slice(0, 200),
                                  what: what.slice(0, 300), km: route ? route.km : undefined });
    if (IN_TG) tg.sendData(data); else alert("Відкрийте карту з бота в Telegram.\n\n" + data);
  }

  function placeLocate() { $("locate").style.bottom = ($("sheet").offsetHeight + 14) + "px"; }

  function choose(side, p) {
    // для водія назва місця разом з адресою: «Нова Пошта Відділення №2 (вул. Соборна, 83)»
    state[side] = { lat: +p.lat, lon: +p.lon, name: p.sub ? `${p.name} (${p.sub})` : p.name, needNumber: !!p.needNumber,
                    auto: !!p.auto };

    remember(p);
    closeSearch();
    redraw();
    // «звідки» є — одразу ставимо мітку «куди»: клієнт лише рухає карту й тисне «Готово»
    if (side === "from" && !state.to) startPin("to");
  }

  function estimate(from, to) {
    // та сама формула, що й у боті: км по дорогах (поки маршрут не прийшов — пряма × коефіцієнт)
    const night = cfg.n || 1;
    const dist = route ? route.km : Math.max(1, Math.ceil(km(from, to) * (cfg.f || 1.3)));
    const trip = route ? `${route.km} км · ${route.min} хв` : `≈ ${dist} км`;
    const r = cfg.r || 4;
    if (km(from, CITY) > r || km(to, CITY) > r) {
      const o = cfg.o || [200, 15];
      return { price: round(round(o[0] + dist * o[1]) * night), label: `за місто · ${trip}` };
    }
    const cm = cfg.cm || [90, 15, 120];
    return { price: round(Math.max(round(cm[2]), round(cm[0] + dist * cm[1])) * night), label: trip };
  }

  function finish() {
    const note = $("note").value.trim();
    const data = JSON.stringify({
      t: "order",
      from: [state.from.lat, state.from.lon], to: [state.to.lat, state.to.lon],
      fa: state.from.name.slice(0, 200),
      c: note.slice(0, 200),
      ta: state.to.name.slice(0, 200),
      km: route ? route.km : undefined,   // справжні км по дорогах — бот рахує ціну за ними
    });
    if (IN_TG) tg.sendData(data);   // Telegram закриває карту й передає дані боту
    else alert("Відкрийте карту з бота в Telegram.\n\n" + data);
  }

  // ---------- недавні адреси (лише на цьому телефоні) ----------
  function recent() { try { return JSON.parse(localStorage.getItem("rover_recent") || "[]"); } catch (e) { return []; } }
  function remember(p) {
    if (p.here) return;
    try {
      const list = [p, ...recent().filter((x) => x.name !== p.name)].slice(0, 5)
        .map(({ name, sub, lat, lon, icon }) => ({ name, sub, lat, lon, icon }));
      localStorage.setItem("rover_recent", JSON.stringify(list));
    } catch (e) { /* приватний режим — без історії */ }
  }

  // ---------- пошук ----------
  let activeSide = null, searchSeq = 0, searchTimer = null;
  const norm = (s) => s.toLowerCase().replace(/ё/g, "е").replace(/[«»"'’.,№#()-]/g, " ")
    .replace(/\s+/g, " ").trim().replace(/(^|\s)нп(?=\s|$)/g, "$1нова пошта");

  function openSearch(side) {
    activeSide = side;
    $("search").classList.remove("hidden");
    $("q").value = "";
    $("q").placeholder = side === "from" ? "Звідки вас забрати?" : "Куди їдемо?";
    hideButton();
    setBack(() => { closeSearch(); redraw(); });
    render("");
    setTimeout(() => $("q").focus(), 50);
  }
  function closeSearch() { $("search").classList.add("hidden"); $("q").blur(); setBack(null); }

  function item(icon, name, sub, onClick) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="ic">${icon}</div><div><div class="nm">${esc(name)}</div>${sub ? `<div class="sb">${esc(sub)}</div>` : ""}</div>`;
    el.onclick = onClick;
    return el;
  }
  function group(title) { const g = document.createElement("div"); g.className = "group"; g.textContent = title; return g; }

  // ---------- вулиці міста (миттєвий пошук без інтернету) ----------
  let streets = [];
  fetch(`streets.json?v=${Date.now() / 3600000 | 0}`).then((r) => r.json()).then((list) => { streets = list; }).catch(() => {});
  const TYPE_WORDS = /^(вулиця|вул|провулок|пров|проспект|просп|площа|пл|майдан|бульвар|бул|узвіз|тупик|шосе|проїзд|в'їзд)$/;
  const streetWords = (name) => norm(name).split(" ").filter((w) => w && !TYPE_WORDS.test(w));

  function splitQuery(q) {
    // «Соборна 54», «соборна, 54а», «вул. Соборна 54/1» → вулиця + номер
    const m = q.trim().match(/^(.*?)[\s,]+(\d+[\p{L}]?(?:\/\d+)?)$/u);
    return m ? { street: m[1], number: m[2] } : { street: q.trim(), number: "" };
  }
  function matchStreets(text) {
    const words = streetWords(text);
    if (!words.length) return [];
    return streets.filter((s) => { const sw = streetWords(s.n); return words.every((w) => sw.some((x) => x.startsWith(w))); })
      .sort((a, b) => (streetWords(a.n)[0].startsWith(words[0]) ? 0 : 1) - (streetWords(b.n)[0].startsWith(words[0]) ? 0 : 1)
                      || a.n.localeCompare(b.n, "uk"));
  }
  function streetMiddle(s) {
    const line = s.p.reduce((a, b) => (b.length > a.length ? b : a), []);
    if (line.length) return line[Math.floor(line.length / 2)];
    const h = Object.values(s.h); return h[0];
  }
  const numVal = (n) => parseInt(n, 10);
  function housePoint(s, number) {
    // номер є в даних — точно; немає — між найближчими відомими номерами цієї вулиці
    if (s.h[number]) return { pt: s.h[number], exact: true };
    const n = numVal(number);
    const known = Object.entries(s.h).map(([k, v]) => [numVal(k), v]).filter(([k]) => !isNaN(k)).sort((a, b) => a[0] - b[0]);
    const lo = [...known].reverse().find(([k]) => k <= n), hi = known.find(([k]) => k >= n);
    if (lo && hi && hi[0] !== lo[0]) {
      const t = (n - lo[0]) / (hi[0] - lo[0]);
      return { pt: [lo[1][0] + (hi[1][0] - lo[1][0]) * t, lo[1][1] + (hi[1][1] - lo[1][1]) * t], exact: false };
    }
    if (lo || hi) return { pt: (lo || hi)[1], exact: false };
    return { pt: streetMiddle(s), exact: false };
  }
  const sortedNumbers = (s) => Object.keys(s.h).sort((a, b) => numVal(a) - numVal(b) || a.localeCompare(b, "uk"));

  function renderStreets(box, q, side) {
    const { street, number } = splitQuery(q);
    const found = matchStreets(street);
    if (!found.length) return 0;
    box.appendChild(group("Вулиці"));
    if (number) {
      found.slice(0, 4).forEach((s) => {
        const hp = housePoint(s, number);
        box.appendChild(item("🏠", `${s.n}, ${number}`, hp.exact ? "" : "приблизне місце на вулиці",
          () => choose(side, { name: `${s.n}, ${number}`, lat: hp.pt[0], lon: hp.pt[1] })));
      });
      // інші відомі номери, що починаються так само («5» → 50, 52, 54…)
      const s0 = found[0];
      sortedNumbers(s0).filter((k) => k !== number && k.startsWith(number)).slice(0, 8).forEach((k) =>
        box.appendChild(item("🏠", `${s0.n}, ${k}`, "", () => choose(side, { name: `${s0.n}, ${k}`, lat: s0.h[k][0], lon: s0.h[k][1] }))));
    } else {
      found.slice(0, 8).forEach((s) => {
        const count = Object.keys(s.h).length;
        box.appendChild(item("🛣", s.n, "натисніть і введіть номер будинку" + (count ? ` · ${count} номерів відомо` : ""), () => {
          $("q").value = `${s.n} `; $("q").focus(); render($("q").value);
        }));
      });
      // вулицю вже обрано (лишився лише номер) — показуємо відомі номери й «без номера»
      if (found.length === 1 || norm(street) === norm(found[0].n)) {
        const s0 = found[0];
        sortedNumbers(s0).slice(0, 12).forEach((k) =>
          box.appendChild(item("🏠", `${s0.n}, ${k}`, "", () => choose(side, { name: `${s0.n}, ${k}`, lat: s0.h[k][0], lon: s0.h[k][1] }))));
        const mid = streetMiddle(s0);
        box.appendChild(item("➖", `${s0.n} — без номера`, "номер можна дописати потім",
          () => choose(side, { name: s0.n, lat: mid[0], lon: mid[1], needNumber: true })));
      }
    }
    return found.length;
  }

  function render(q) {
    const box = $("results"); box.innerHTML = "";
    const side = activeSide;
    box.appendChild(item("📍", "Вказати на карті", "Поставте мітку вручну", () => startPin(side)));
    if (side === "from") box.appendChild(item("🧭", "Моє місцезнаходження", "", () => locateMe(true)));
    const nq = norm(q);
    const all = [...places, ...npPlaces];
    if (!nq) {
      const rec = recent();
      if (rec.length) { box.appendChild(group("Недавні")); rec.forEach((p) => box.appendChild(item("🕘", p.name, p.sub, () => choose(side, p)))); }
      const mine = all.filter((p) => p.own || p.np);
      if (mine.length) { box.appendChild(group("Місця")); mine.forEach((p) => box.appendChild(item(p.icon, p.name, p.sub, () => choose(side, p)))); }
      return;
    }
    const streetHits = renderStreets(box, q, side);
    const words = nq.split(" ");
    const hits = all.filter((p) => { const h = norm(`${p.name} ${p.sub || ""} ${CATEGORY[p.icon] || ""}`); return words.every((w) => h.includes(w)); });
    const num = (nq.match(/\d+/) || [])[0];
    if (num) hits.sort((a, b) => (new RegExp(`№\\s*${num}\\b`).test(b.name) ? 1 : 0) - (new RegExp(`№\\s*${num}\\b`).test(a.name) ? 1 : 0));
    if (hits.length) { box.appendChild(group("Місця")); hits.slice(0, 25).forEach((p) => box.appendChild(item(p.icon, p.name, p.sub, () => choose(side, p)))); }
    if (streetHits) return;   // вулиці знайшли миттєво — інтернет-пошук не потрібен
    const addrGroup = group("Адреси"); addrGroup.id = "addrGroup"; box.appendChild(addrGroup);
    const wait = item("⏳", "Шукаємо адреси…", "", () => {}); wait.id = "addrWait"; box.appendChild(wait);
    clearTimeout(searchTimer);
    const seq = ++searchSeq;
    searchTimer = setTimeout(() => searchAddress(q, seq), 500);
  }

  async function searchAddress(q, seq) {
    const typedNumber = (q.match(/(\d+[\p{L}]?(?:\/\d+)?)\s*$/u) || [])[1] || "";
    let list = [];
    try {
      const bbox = [CITY[1] - 0.25, CITY[0] - 0.15, CITY[1] + 0.25, CITY[0] + 0.15].join(",");
      const j = await getJSON(`https://photon.komoot.io/api/?lang=default&q=${encodeURIComponent(q)}&lat=${CITY[0]}&lon=${CITY[1]}&bbox=${bbox}&limit=8`, 4000);
      list = (j.features || []).map((f) => {
        const pr = f.properties || {}, [lon, lat] = f.geometry.coordinates;
        const street = pr.street || (pr.type === "street" ? pr.name : "");
        return { street, number: pr.housenumber || "", poi: street && pr.name !== street ? pr.name : (street ? "" : pr.name),
                 town: pr.city || pr.town || pr.village || "", lat, lon };
      });
    } catch (e) { list = []; }
    if (!list.length) {
      try {
        const vb = [CITY[1] - 0.25, CITY[0] + 0.15, CITY[1] + 0.25, CITY[0] - 0.15].join(",");
        const j = await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=uk&countrycodes=ua&limit=8&addressdetails=1&viewbox=${vb}&bounded=1&q=${encodeURIComponent(q)}`, 5000);
        list = j.map((r) => { const a = r.address || {};
          return { street: a.road || a.pedestrian || "", number: a.house_number || "", poi: r.name && r.name !== a.road ? r.name : "",
                   town: a.village || a.town || a.city || "", lat: +r.lat, lon: +r.lon }; });
      } catch (e) { list = []; }
    }
    list = list.filter((r) => km([r.lat, r.lon], CITY) < 35);   // лише Новоукраїнка й околиці
    if (seq !== searchSeq) return;
    const wait = $("addrWait"); if (wait) wait.remove();
    const box = $("results");
    if (!list.length) { box.appendChild(item("🤷", "Адресу не знайдено", "Спробуйте інакше або вкажіть на карті", () => startPin(activeSide))); return; }
    const seen = new Set();
    list.forEach((r) => {
      // номера немає в даних карти, але клієнт його написав — підставляємо сам
      const number = r.number || (r.street && typedNumber ? typedNumber : "");
      const base = r.street ? [r.street, number].filter(Boolean).join(", ") : r.poi;
      const name = base + (r.town && r.town !== CITY_NAME ? `, ${r.town}` : "");
      if (!name || seen.has(name)) return; seen.add(name);
      box.appendChild(item(r.number ? "🏠" : "🛣", name, r.street && r.poi ? r.poi : (r.town && r.town !== CITY_NAME ? "" : ""),
        () => choose(activeSide, { name, lat: r.lat, lon: r.lon, needNumber: !!r.street && !number })));
    });
  }
  $("q").addEventListener("input", () => render($("q").value));
  $("sBack").onclick = () => { closeSearch(); redraw(); };

  // ---------- мітка на карті вручну ----------
  let pinSide = null, geoTimer = null, geoSeq = 0, pinName = "";
  function startPin(side) {
    pinSide = side; closeSearch();
    const p = state[side];
    if (p) map.setView([p.lat, p.lon], 17); else if (state.from) map.setView([state.from.lat, state.from.lon], 16);
    $("pin").textContent = side === "from" ? "📍" : "🏁";
    $("pin").classList.remove("hidden"); $("pinbar").classList.remove("hidden"); $("sheet").classList.add("hidden");
    $("pinTitle").textContent = side === "from" ? "Звідки вас забрати?" : (DELIVERY ? "Куди привезти?" : "Куди їдемо?");
    setBack(() => endPin(false));
    setButton("Готово", () => endPin(true));
    reverse(center());
  }
  function endPin(ok) {
    $("pin").classList.add("hidden"); $("pinbar").classList.add("hidden"); $("sheet").classList.remove("hidden");
    setBack(null);
    const side = pinSide; pinSide = null;
    if (!ok) { redraw(); return; }
    const c = center();
    const pick = (name, hasNumber) => choose(side, { lat: c[0], lon: c[1], name: name || "Точка на карті", here: true,
                                                     needNumber: !hasNumber });
    if (pinName) { pick(pinName, pinHasNumber); return; }
    // натиснули «Готово» до того, як адреса визначилась, — коротко чекаємо її
    clearTimeout(geoTimer); geoSeq++;
    const place = placeAt(c);
    if (place) { pick(place.sub ? `${place.name} (${place.sub})` : place.name, true); return; }
    reverseAddr(c[0], c[1]).then((r) => pick(r.name, r.number)).catch(() => pick("", false));
  }
  let pinHasNumber = false;

  // заклад під міткою: спершу наші місця (≈40 м), потім підписи самої карти
  function placeAt(point) {
    let best = null, bestD = 0.04;
    [...places, ...npPlaces].forEach((p) => { const d = km(point, [p.lat, p.lon]); if (d < bestD) { bestD = d; best = p; } });
    if (best) return { icon: best.icon, name: best.name, sub: best.sub || "" };
    try {
      const m = gl && gl.getMaplibreMap();
      if (!m) return null;
      const c = m.project([point[1], point[0]]);
      const f = m.queryRenderedFeatures([[c.x - 22, c.y - 22], [c.x + 22, c.y + 22]])
        .find((x) => x.layer.id.startsWith("poi") && (x.properties["name:uk"] || x.properties.name));
      if (f) return { icon: "📌", name: f.properties["name:uk"] || f.properties.name, sub: "" };
    } catch (e) { /* карта ще не готова */ }
    return null;
  }

  function reverse(point) {
    clearTimeout(geoTimer);
    pinName = ""; pinHasNumber = false;
    const place = placeAt(point);
    // назву закладу показуємо одразу, адресу дописуємо, коли знайдеться
    $("pinAddr").textContent = place ? `${place.icon} ${place.name}` : "Визначаємо адресу…";
    if (place) { pinName = place.sub ? `${place.name} (${place.sub})` : place.name; pinHasNumber = true; }
    const seq = ++geoSeq;
    geoTimer = setTimeout(async () => {
      if (place && place.sub) return;
      const r = await reverseAddr(point[0], point[1]);
      if (seq !== geoSeq) return;
      if (place) {
        pinName = r.name ? `${place.name} (${r.name})` : place.name;
        $("pinAddr").textContent = `${place.icon} ${pinName}`;
        return;
      }
      pinName = r.name; pinHasNumber = r.number;
      $("pinAddr").textContent = pinName ? pinName + (pinHasNumber ? "" : " · номер уточните далі") : "Точка на карті";
    }, 400);
  }
  map.on("moveend", () => { if (pinSide) reverse(center()); });
  // 🔎 у режимі мітки — до пошуку адреси для того ж поля
  $("pinSearch").onclick = () => {
    const side = pinSide; pinSide = null;
    $("pin").classList.add("hidden"); $("pinbar").classList.add("hidden"); $("sheet").classList.remove("hidden");
    openSearch(side);
  };
  map.on("move", () => {
    if (!pinSide) return;
    const place = placeAt(center());
    if (place) $("pinAddr").textContent = `${place.icon} ${place.name}`;
  });

  // ---------- моє місцезнаходження ----------
  function locateMe(explicit) {
    if (!navigator.geolocation) return;
    // телефон спершу дає грубе місце (Wi-Fi/вишки, похибка 100–500 м), точний GPS приходить за кілька секунд —
    // слухаємо до 15 с і щоразу беремо точніше; ручну зміну «звідки» клієнтом не перезаписуємо
    let best = null, watch = null, placed = false;
    const stop = () => { if (watch !== null) navigator.geolocation.clearWatch(watch); watch = null; };
    watch = navigator.geolocation.watchPosition(async (pos) => {
      const acc = pos.coords.accuracy || 9999;
      if (best && acc >= best) return;
      best = acc;
      if (acc <= 20) stop();
      const here = [pos.coords.latitude, pos.coords.longitude];
      if (!explicit && km(here, CITY) > 40) return stop();   // відкрили з іншого міста — лишаємо Новоукраїнку
      if (placed && !(state.from && state.from.auto)) return stop();
      const r = await reverseAddr(here[0], here[1]);
      const p = { lat: here[0], lon: here[1], name: r.name || "Моє місцезнаходження", here: true,
                  needNumber: !r.number, auto: true };
      if (!placed) {
        if (!explicit && state.from) return stop();
        placed = true;
        choose("from", p);
      } else if (state.from && state.from.auto) {
        // уточнення: лише пересуваємо «звідки», мітку «куди», яку клієнт зараз ставить, не чіпаємо
        state.from = { lat: p.lat, lon: p.lon, name: p.name, needNumber: p.needNumber, auto: true };
        redraw();
      }
    }, () => {
      if (best) return;
      stop();
      if (explicit && IN_TG) tg.showAlert("Не вдалося визначити місце. Дозвольте геолокацію або вкажіть на карті.");
      if (!explicit && !state.from && !pinSide) startPin("from");
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    setTimeout(stop, 15000);
  }
  $("locate").onclick = () => {
    if (pinSide) navigator.geolocation && navigator.geolocation.getCurrentPosition((p) => map.setView([p.coords.latitude, p.coords.longitude], 17),
                                                                              () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
    else locateMe(true);
  };

  // ---------- швидкі кнопки ----------
  function chips() {
    const box = $("chips"); box.innerHTML = "";
    const add = (text, fn) => { const c = document.createElement("div"); c.className = "chip"; c.textContent = text; c.onclick = fn; box.appendChild(c); };
    const find = (q) => () => { openSearch(state.from ? "to" : "from"); $("q").value = q; render(q); };
    add("📦 Нова Пошта", find("нова пошта"));
    places.filter((p) => p.own).slice(0, 4).forEach((p) => add(`${p.icon} ${p.name}`, () => choose(state.from ? "to" : "from", p)));
    add("🛒 Магазини", find("магазин"));
    add("☕ Кафе", find("кафе"));
    add("💊 Аптеки", find("аптека"));
    add("🚌 Автостанція", find("автостанція"));
    add("📍 На карті", () => startPin(state.from ? "to" : "from"));
  }

  $("fFrom").onclick = () => openSearch("from");
  $("fTo").onclick = () => openSearch("to");

  if (IN_TG) {
    tg.ready(); tg.expand();
    if (tg.MainButton) tg.MainButton.setParams({ color: "#f5a623", text_color: "#111111" });
  }
  // доставка працює лише в свої години (за годинником телефону; сервер теж перевіряє)
  const dh = cfg.dh || [8, 24], hour = new Date().getHours();
  if (DELIVERY && !(dh[0] <= hour && hour < dh[1])) {
    const msg = `Доставка працює з ${String(dh[0] % 24).padStart(2, "0")}:00 до ${String(dh[1] % 24).padStart(2, "0")}:00. Зараз можна замовити таксі 🚕`;
    if (IN_TG) tg.showAlert(msg, () => tg.close()); else alert(msg);
  } else if (DELIVERY) {
    chips(); redraw(); startPin("to");
    $("pinTitle").textContent = "Куди привезти?";
    // зазвичай везуть додому — ставимо мітку там, де клієнт зараз
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
      (pos) => { if (pinSide) map.setView([pos.coords.latitude, pos.coords.longitude], 17); }, () => {},
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 });
  } else {
    chips(); redraw(); locateMe(false);
    // телефон довго шукає місце (або не відповідає) — не чекаємо, просимо поставити «звідки» на карті
    setTimeout(() => { if (!state.from && !pinSide && $("search").classList.contains("hidden")) startPin("from"); }, 5000);
  }
  window.addEventListener("resize", placeLocate);
})();
</script>
</body>
</html>
